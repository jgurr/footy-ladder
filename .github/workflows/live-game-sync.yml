      - cron: "45-55/5 9 25 6 *"
      - cron: "*/5 10,11 25,26,27 6 *"
      - cron: "0-50/5 12 25 6 *"
      - cron: "55 7 26 6 *"
      - cron: "*/5 8 26,27,28 6 *"
      - cron: "*/5 9 26,27 6 *"
      - cron: "*/5 12 26 6 *"
      - cron: "0 13 26 6 *"
      - cron: "55 4 27 6 *"
      - cron: "*/5 5,6,7 27,28 6 *"
      - cron: "0-35/5 12 27 6 *"
      - cron: "55 3 28 6 *"
      - cron: "*/5 4 28 6 *"
      - cron: "0,5 9 28 6 *"
      - cron: "55 9 3,10 7 *"
      - cron: "*/5 10 3,4,10,11,12,16,17,18,23,24,25,30,31 7 *"
      - cron: "*/5 11 3,4,10,11,16,17,18,23,24,25,30,31 7 *"
      - cron: "*/5 12 3,10,17,24,31 7 *"
      - cron: "0 13 3,10,17,24,31 7 *"
      - cron: "25-55/5 7 4 7 *"
      - cron: "*/5 8 4,5,11,12,17,18,19,24,25,26,31 7 *"
      - cron: "*/5 9 4,11,12,17,18,24,25,31 7 *"
      - cron: "0-35/5 12 4,11,18,25 7 *"
      - cron: "55 3 5,12,19,26 7 *"
      - cron: "*/5 4 5,12,19,26 7 *"
      - cron: "*/5 5,6,7 5,11,12,18,19,25,26 7 *"
      - cron: "0,5 9 5,19,26 7 *"
      - cron: "55 4 11,18,25 7 *"
      - cron: "0-15/5 11 12 7 *"
      - cron: "45-55/5 9 16,23,30 7 *"
      - cron: "0-50/5 12 16,23,30 7 *"
      - cron: "55 7 17,24,31 7 *"
      - cron: "55 4 1,8,15,22,29 8 *"
      - cron: "*/5 5,6,7 1,2,8,9,15,16,22,23,29,30 8 *"
      - cron: "*/5 8 1,2,7,8,9,14,15,16,21,22,23,28,29,30 8 *"
      - cron: "*/5 9 1,7,8,14,15,21,22,28,29 8 *"
      - cron: "*/5 10,11 1,6,7,8,13,14,15,20,21,22,27,28,29 8 *"
      - cron: "0-35/5 12 1,8,15,22,29 8 *"
      - cron: "55 3 2,9,16,23,30 8 *"
      - cron: "*/5 4 2,9,16,23,30 8 *"
      - cron: "0,5 9 2,9,16,23,30 8 *"
      - cron: "45-55/5 9 6,13,20,27 8 *"
      - cron: "0-50/5 12 6,13,20,27 8 *"
      - cron: "55 7 7,14,21,28 8 *"
      - cron: "*/5 12 7,14,21,28 8 *"
      - cron: "0 13 7,14,21,28 8 *"
      - cron: "45-55/5 9 3 9 *"
      - cron: "*/5 10,11 3,4,5 9 *"
      - cron: "0-50/5 12 3 9 *"
      - cron: "55 7 4 9 *"
      - cron: "*/5 8 4,5,6 9 *"
      - cron: "*/5 9 4,5 9 *"
      - cron: "*/5 12 4 9 *"
      - cron: "0 13 4 9 *"
      - cron: "55 4 5 9 *"
      - cron: "*/5 5,6,7 5,6 9 *"
      - cron: "0-35/5 12 5 9 *"
      - cron: "55 3 6 9 *"
      - cron: "*/5 4 6 9 *"
      - cron: "0,5 9 6 9 *"
      # END GENERATED GAME WINDOWS
  workflow_dispatch:
    inputs:
      force:
        description: Sync now even when no game window is active
        required: false
        default: false
        type: boolean
      round:
        description: Optional round for a forced recovery sync
        required: false
        type: string

concurrency:
  group: live-game-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check game window
        id: window
        env:
          SITE_URL: https://www.getemonside.com
          SEASON: "2026"
        run: node scripts/check-game-sync-window.mjs

      - name: Sync official NRL draw
        if: steps.window.outputs.active == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force)
        env:
          SITE_URL: https://www.getemonside.com
          SEASON: ${{ steps.window.outputs.season }}
          ROUND: ${{ inputs.round || steps.window.outputs.round }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          sync_url="${SITE_URL}/api/cron/sync?season=${SEASON}"
          if [ -n "${ROUND}" ]; then
            sync_url="${sync_url}&round=${ROUND}"
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --max-time 240 \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            "${sync_url}"

      - name: Skip outside game window
        if: steps.window.outputs.active != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.force)
        run: echo "No game is within the configured sync window."
