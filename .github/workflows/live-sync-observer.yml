name: Live sync observer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check production live sync health
        env:
          SITE_URL: https://www.getemonside.com
          SEASON: "2026"
          MAX_SYNC_STALENESS_MINUTES: "15"
        run: node scripts/check-live-sync-health.mjs
